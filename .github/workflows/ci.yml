name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Build .app bundle
        run: ./build.sh

      - name: Upload bundle artifact
        uses: actions/upload-artifact@v4
        with:
          name: Free-Mac-Monitor
          path: Free Mac Monitor.app
