name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Build .app bundle
        run: ./build.sh

      - name: Package zip + checksum
        run: |
          ZIP="Free-Mac-Monitor-${GITHUB_REF_NAME}.zip"
          ditto -c -k --keepParent "Free Mac Monitor.app" "$ZIP"
          shasum -a 256 "$ZIP" > "$ZIP.sha256"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "$GITHUB_REF_NAME" \
            --generate-notes \
            "Free-Mac-Monitor-${GITHUB_REF_NAME}.zip" \
            "Free-Mac-Monitor-${GITHUB_REF_NAME}.zip.sha256"
